[build]
builder = "DOCKERFILE"
dockerfilePath = "g5/Dockerfile.g5-browser-source"

[deploy]
startCommand = "python -I /opt/g5/lifecycle_entry.py"
restartPolicyType = "NEVER"
numReplicas = 1
overlapSeconds = 0
drainingSeconds = 30
