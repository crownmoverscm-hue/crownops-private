name: CrownOps CI

on:
  pull_request:
  push:
    branches:
      - main
      - "audit/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install photo and video runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app manage.py tests
      - name: Run release-readiness tests
        env:
          CROWNOPS_ENV: test
          CROWNOPS_ALLOW_EXTERNAL: "0"
          QBO_ENV: sandbox
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: |
          for f in app/static/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Test local calculator guidance
        run: node --test tests/*.test.cjs
      - name: Test Wix office workflow on phone, tablet and desktop
        env:
          CROWNOPS_BROWSER_WIX: "1"
          NODE_PATH: /tmp/crownops-browser/node_modules
        run: |
          npm install --prefix /tmp/crownops-browser --no-audit --no-fund playwright@1.62.1
          /tmp/crownops-browser/node_modules/.bin/playwright install --with-deps chromium
          python tests/browser/run_mobile.py wix_sync
      - name: Test shared Inbox and client portal on phone, tablet and desktop
        env:
          NODE_PATH: /tmp/crownops-browser/node_modules
        run: python tests/browser/run_mobile.py inbox
      - name: Test configurable payroll periods and private hours
        env:
          NODE_PATH: /tmp/crownops-browser/node_modules
          CROWNOPS_BROWSER_HOURS_COSTS: "1"
        run: python tests/browser/run_mobile.py payroll_periods
      - name: Test owner-only expenses and cost approval
        env:
          NODE_PATH: /tmp/crownops-browser/node_modules
          CROWNOPS_BROWSER_HOURS_COSTS: "1"
        run: python tests/browser/run_mobile.py hours_costs
      - name: Test My Portal approvals, private documents and mobile layout
        env:
          NODE_PATH: /tmp/crownops-browser/node_modules
        run: python tests/browser/run_mobile.py staff_portal
      - name: Test manual client video, review sharing and independent free entry
        env:
          NODE_PATH: /tmp/crownops-browser/node_modules
        run: python tests/browser/run_mobile.py client_participation
      - name: Test friendly recovery and visible release identity
        env:
          NODE_PATH: /tmp/crownops-browser/node_modules
        run: python tests/browser/run_mobile.py browser_recovery
      - name: Test sticky navigation and day, week and month schedules
        env:
          NODE_PATH: /tmp/crownops-browser/node_modules
        run: python tests/browser/run_mobile.py mobile_schedule
      - name: Test Today activity, unfinished tasks and client database
        env:
          NODE_PATH: /tmp/crownops-browser/node_modules
        run: python tests/browser/run_mobile.py today_workspace
      - name: Smoke-create application
        env:
          CROWNOPS_ENV: test
          CROWNOPS_ALLOW_EXTERNAL: "0"
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from app.main import create_app
          with tempfile.TemporaryDirectory() as td:
              app=create_app(Path(td)/"crownops.sqlite3")
              print("routes", len(app.routes))
          PY
